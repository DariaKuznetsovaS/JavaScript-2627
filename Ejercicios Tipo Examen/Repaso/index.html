<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
</head>
<body>

    <h1>Registrar producto</h1>

    <input type="text" id="nombre" placeholder="Nombre">
    <input type="number" id="precio" placeholder="Precio">

    <h3>Categoría:</h3>

<label>
    <input type="radio" name="categoria" value="informatica">
    Informática
</label>

<label>
    <input type="radio" name="categoria" value="ropa">
    Ropa
</label>

<label>
    <input type="radio" name="categoria" value="hogar">
    Hogar
</label>

    <button id="bAñadir">Añadir producto</button>

    <div id="listaProductos"></div>

    <script src="script.js"></script>
</body>
</html>
