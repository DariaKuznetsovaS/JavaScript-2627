
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
	<title>Practica Uno, eje 2</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <style>
        *{box-sizing: border-box;
        padding: 0;
        margin: 0;
        font-family: sans-serif;
        }
        
        form{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        width: 30%;
        margin: 0 auto;
        margin-top: 2rem;
        gap: 1rem;
        }
        label{
        font-weight: bold;
        }
        input{
        background-color: lightblue;
        padding: .5rem;
        
        }

        input:hover{
        background-color: lightyellow;
        }
        .botones{
            display:flex;
            flex-direction: row;
            gap: 1rem;
        }
    </style>

</head>
<body>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">
        
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos">

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email">

        <label for="poblacion">Población:</label>
        <input type="text" id="poblacion">

        <label for="provincia">Provincia</label>
        <input type="text" id="provincia">

        <p>Edad:</p>

        <p><input type="radio" value="0-20" name="edad"> 0-20</p>
        <p><input type="radio" value="20-40" name="edad"> 20-40</p>
        <p><input type="radio" value="40-60" name="edad"> 40-60</p>
        <p><input type="radio" value="60-100" name="edad">60-100</p>

        <p>¿Cómo nos has conocido?</p>
        <p> <input type="checkbox" name="info" value="amigo">Através de un amigo.</p>
        <p> <input type="checkbox" name="info" value="buscador">Através de un buscador</p>
        <p> <input type="checkbox" name="info" value="red">Navegando por la red</p>
        <p> <input type="checkbox" name="info" value="otro">Otros</p>

        
        <div class="botones">
        <input type="button" id="bEnviar" value="Enviar formulario">
        <input type="button" id="bBorrar" value="Borrar">
        </div>
    </form>

    <script>
document.getElementById("bEnviar").addEventListener("click", enviarDatos);
document.getElementById("bBorrar").addEventListener("click", borrarDatos);

function enviarDatos() {

    try {

        let nombre = document.getElementById("nombre").value;
        let apellidos = document.getElementById("apellidos").value;
        let email = document.getElementById("email").value;
        let poblacion = document.getElementById("poblacion").value;
        let provincia = document.getElementById("provincia").value;

        // RADIO BUTTONS

        let edad = document.getElementsByName("edad");
        let edadSeleccionada = "";

        for (let x = 0; x < edad.length; x++) {

            if (edad[x].checked) {
                edadSeleccionada = edad[x].value;
            }

        }

        // CHECKBOXES

        let info = document.getElementsByName("info");
        let infoSeleccionada = [];

        for (let x = 0; x < info.length; x++) {

            if (info[x].checked) {
                infoSeleccionada.push(info[x].value);
            }

        }

        // VALIDAR CAMPOS

        if (!nombre || !apellidos || !email || !poblacion || !provincia) {
            throw new Error("Todos los campos deben ser cumplimentados");
        }

        if (!edadSeleccionada) {
            throw new Error("Debes seleccionar una edad");
        }

        if (infoSeleccionada.length === 0) {
            throw new Error("Debes indicar cómo nos has conocido");
        }

        
        // VALIDAR CON REGEX

        if (!validarDato(nombre, "nombre")) {
            throw new Error("El nombre no es válido");
        }

        if (!validarDato(apellidos, "apellidos")) {
            throw new Error("Los apellidos no son válidos");
        }

        if (!validarDato(email, "email")) {
            throw new Error("El email no es válido");
        }

        if (!validarDato(poblacion, "poblacion")) {
            throw new Error("La población no es válida");
        }

        if (!validarDato(provincia, "provincia")) {
            throw new Error("La provincia no es válida");
        }

        // CREAR OBJETO 

        let datos = {
            nombre: nombre,
            apellidos: apellidos,
            email: email,
            poblacion: poblacion,
            provincia: provincia,
            edad: edadSeleccionada,
            info: infoSeleccionada
        };
        // CONVERTIR OBJETO A JSON

        let datosJSON = JSON.stringify(datos);

        // GUARDAR EN LOCALSTORAGE

        localStorage.setItem("datos", datosJSON);
        
        // MOSTRAR EN ALERT

        alert(datosJSON);

    } catch (err) {

        alert(err.message);

    }
}

function validarDato(dato, tipo) {

    switch (tipo) {

        case "nombre":
            return /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(dato);

        case "apellidos":
            return /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(dato);

        case "email":
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(dato);

        case "poblacion":
            return /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(dato);

        case "provincia":
            return /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(dato);

        default:
            return false;
    }
}


function borrarDatos() {
    localStorage.clear();
}
</script>


    


    </script>

</body>

</html>
