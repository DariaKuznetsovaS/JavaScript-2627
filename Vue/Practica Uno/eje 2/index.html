
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Tarjeta usuario</title>
</head>
<body>

    <template id="tarjeta-template">

        <style>
            .tarjeta {
                border: 1px solid #ccc;
                border-radius: 10px;
                padding: 20px;
                width: 200px;
                height: 150px;
                margin-bottom: 1rem;
                text-align: center;
            }

            .rol {
                background-color: orange;
                font-weight: bold;
                padding: 5px 10px;
                border-radius: 5px;
                font-size: 12px;
            }
        </style>

        <div class="tarjeta">
            <h3>
                <slot name="nombre"></slot>
            </h3>

            <p>
                <slot name="email">
                    Sin correo
                </slot>
            </p>

            <span class="rol"></span>
        </div>

    </template>

    <tarjeta-usuario rol="Alumno">
        <p slot="nombre">Daria</p>
        <p slot="email">daria@gmail.com</p>
    </tarjeta-usuario>

    <tarjeta-usuario rol="Profesor">
        <p slot="nombre">Carlos</p>
    </tarjeta-usuario>

    <script src="tarjeta-usuario.js"></script>

</body>
</html>
